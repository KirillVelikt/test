name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name TerminalControl pc-control/terminal_control.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        run: '&"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/terminal_installer.iss'

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TerminalControl-EXE
          path: dist/TerminalControl.exe

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: TerminalControl-Installer
          path: installer/Output/TerminalControlSetup.exe
